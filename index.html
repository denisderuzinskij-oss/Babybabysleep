<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Сон малыша</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --danger: #ff3b30;
      --border: rgba(128, 128, 128, 0.18);

      --sleep: #2481cc;
      --awake: #f2a154;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    .card {
      background: var(--secondary-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .status-line {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .big-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      background: var(--button);
      color: var(--button-text);
      cursor: pointer;
    }

    .big-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .secondary-button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      background: rgba(128, 128, 128, 0.12);
      color: var(--text);
      cursor: pointer;
    }

    .secondary-button:disabled {
      opacity: 0.5;
    }

    .diaper-buttons {
      display: flex;
      gap: 8px;
    }

    .diaper-button {
      flex: 1;
      padding: 15px 8px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      background: rgba(128, 128, 128, 0.12);
      color: var(--text);
      cursor: pointer;
    }

    .diaper-button:active {
      transform: scale(0.98);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .stats-row:last-child {
      margin-bottom: 0;
    }

    .hint {
      color: var(--hint);
      font-size: 13px;
    }

    .event-stats {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-info {
      min-width: 0;
      flex: 1;
    }

    .history-time {
      line-height: 1.35;
    }

    .history-duration {
      margin-top: 3px;
      color: var(--hint);
      font-size: 13px;
    }

    .edit-btn {
      flex-shrink: 0;
      border: none;
      border-radius: 9px;
      padding: 8px 11px;
      background: rgba(128, 128, 128, 0.14);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    #error {
      color: var(--danger);
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }

    .empty {
      color: var(--hint);
      font-size: 14px;
      padding: 4px 0;
    }

    .nav-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .nav-button {
      flex: 1;
      padding: 11px 10px;
      margin-top: 0;
    }

    /* =========================
       СТАТИСТИКА
       ========================= */

    .stats-filter-buttons {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .stats-filter-button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px 6px;
      background: rgba(128, 128, 128, 0.12);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .stats-filter-button.active {
      background: var(--button);
      color: var(--button-text);
      font-weight: 600;
    }

    .stats-filter-fields {
      margin-top: 12px;
    }

    .stats-filter-fields input {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: rgba(128, 128, 128, 0.12);
      color: var(--text);
      padding: 0 12px;
      font-size: 15px;
      font-family: inherit;
    }

    .date-range {
      display: flex;
      gap: 8px;
    }

    .date-range > div {
      flex: 1;
      min-width: 0;
    }

    .filter-label {
      display: block;
      color: var(--hint);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .stats-period-label {
      margin-top: 10px;
      color: var(--hint);
      font-size: 12px;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .summary-box {
      background: rgba(128, 128, 128, 0.10);
      border-radius: 12px;
      padding: 13px;
    }

    .summary-title {
      color: var(--hint);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 19px;
      font-weight: 600;
    }

    .summary-subtitle {
      color: var(--hint);
      font-size: 12px;
      margin-top: 3px;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
    }

    .gantt-wrapper {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .gantt {
      min-width: 500px;
    }

    .gantt-row {
      margin-bottom: 18px;
    }

    .gantt-row-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .gantt-track-wrapper {
      position: relative;
      padding-bottom: 22px;
    }

    .gantt-track {
      height: 34px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: var(--awake);
    }

    .gantt-sleep {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--sleep);
      border-radius: 6px;
      min-width: 2px;
    }
